<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FrutiHorti - Produtos</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: sans-serif;
      line-height: 1.4;
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 24px;
      font-weight: 600;
    }

    .actions {
      margin-bottom: 16px;
    }

    button {
      padding: 6px 12px;
      border: 1px solid #000;
      background: #fff;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid #000;
      padding: 8px;
      text-align: left;
      vertical-align: middle;
    }

    .row-actions {
      display: flex;
      gap: 8px;
    }

    .panel {
      border: 1px solid #000;
      padding: 12px;
      margin-bottom: 16px;
    }

    .hidden {
      display: none;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field input {
      width: 100%;
      padding: 6px;
      border: 1px solid #000;
      background: #fff;
    }

    .panel-actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }

    .message {
      min-height: 20px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Produtos</h1>

    <div class="actions">
      <button id="create-product-btn" type="button">Criar Produto</button>
    </div>

    <p id="message" class="message" aria-live="polite"></p>

    <section id="product-form-panel" class="panel hidden" aria-label="Formulario de produto">
      <h2 id="form-title">Novo produto</h2>
      <form id="product-form">
        <div class="form-grid">
          <label class="field">
            Nome
            <input id="field-nome" name="nome" required />
          </label>

          <label class="field">
            Categoria
            <input id="field-categoria" name="categoria" required />
          </label>

          <label class="field">
            Preco unitario
            <input id="field-preco" name="preco_unitario" type="number" step="0.01" min="0" required />
          </label>

          <label class="field">
            Estoque
            <input id="field-estoque" name="quantidade_estoque" type="number" step="1" min="0" required />
          </label>

          <label class="field">
            Codigo do lote
            <input id="field-lote" name="codigo_lote" required />
          </label>

          <label class="field">
            Data de validade
            <input id="field-validade" name="data_validade" type="date" required />
          </label>
        </div>

        <div class="panel-actions">
          <button type="submit">Salvar</button>
          <button id="cancel-form-btn" type="button">Cancelar</button>
        </div>
      </form>
    </section>

    <section id="delete-panel" class="panel hidden" aria-label="Confirmacao de exclusao">
      <p id="delete-text">Deseja excluir este produto?</p>
      <div class="panel-actions">
        <button id="confirm-delete-btn" type="button">Confirmar exclusao</button>
        <button id="cancel-delete-btn" type="button">Cancelar</button>
      </div>
    </section>

    <table aria-label="Tabela de produtos">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Categoria</th>
          <th>Preco</th>
          <th>Estoque</th>
          <th>Acoes</th>
        </tr>
      </thead>
      <tbody id="products-body"></tbody>
    </table>
  </main>

  <script>
    const API_BASE_URL = 'http://localhost:3000';
    const productsBody = document.getElementById('products-body');
    const createProductButton = document.getElementById('create-product-btn');
    const messageEl = document.getElementById('message');
    const formPanel = document.getElementById('product-form-panel');
    const formTitle = document.getElementById('form-title');
    const productForm = document.getElementById('product-form');
    const cancelFormButton = document.getElementById('cancel-form-btn');
    const deletePanel = document.getElementById('delete-panel');
    const deleteText = document.getElementById('delete-text');
    const confirmDeleteButton = document.getElementById('confirm-delete-btn');
    const cancelDeleteButton = document.getElementById('cancel-delete-btn');

    const fieldNome = document.getElementById('field-nome');
    const fieldCategoria = document.getElementById('field-categoria');
    const fieldPreco = document.getElementById('field-preco');
    const fieldEstoque = document.getElementById('field-estoque');
    const fieldLote = document.getElementById('field-lote');
    const fieldValidade = document.getElementById('field-validade');

    let currentProducts = [];
    let editingProductId = null;
    let pendingDeleteId = null;

    function buildActionButtons(productId) {
      return `
        <div class="row-actions">
          <button type="button" data-action="edit" data-id="${productId}">Editar</button>
          <button type="button" data-action="delete" data-id="${productId}">Excluir</button>
        </div>
      `;
    }

    function renderProducts(items) {
      currentProducts = items;
      productsBody.innerHTML = '';

      if (!items.length) {
        productsBody.innerHTML = `
          <tr>
            <td colspan="6">Nenhum produto encontrado.</td>
          </tr>
        `;
        return;
      }

      for (const product of items) {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${product.id}</td>
          <td>${product.nome}</td>
          <td>${product.categoria}</td>
          <td>${Number(product.preco_unitario).toFixed(2)}</td>
          <td>${product.quantidade_estoque}</td>
          <td>${buildActionButtons(product.id)}</td>
        `;
        productsBody.appendChild(row);
      }
    }

    function setMessage(text) {
      messageEl.textContent = text;
    }

    function openCreateForm() {
      editingProductId = null;
      formTitle.textContent = 'Novo produto';
      productForm.reset();
      fieldLote.value = `L${Date.now()}`;
      formPanel.classList.remove('hidden');
      fieldNome.focus();
    }

    function openEditForm(product) {
      editingProductId = product.id;
      formTitle.textContent = `Editar produto #${product.id}`;
      fieldNome.value = product.nome;
      fieldCategoria.value = product.categoria;
      fieldPreco.value = Number(product.preco_unitario).toFixed(2);
      fieldEstoque.value = String(product.quantidade_estoque);
      fieldLote.value = product.codigo_lote;
      fieldValidade.value = product.data_validade;
      formPanel.classList.remove('hidden');
      fieldNome.focus();
    }

    function closeForm() {
      editingProductId = null;
      formPanel.classList.add('hidden');
      productForm.reset();
    }

    function collectFormPayload() {
      return {
        nome: fieldNome.value.trim(),
        categoria: fieldCategoria.value.trim(),
        preco_unitario: Number(fieldPreco.value),
        quantidade_estoque: Number(fieldEstoque.value),
        codigo_lote: fieldLote.value.trim(),
        data_validade: fieldValidade.value
      };
    }

    async function createProduct(payload) {

      const response = await fetch(`${API_BASE_URL}/products`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        const errorBody = await response.json().catch(() => ({}));
        throw new Error(errorBody.error || 'Falha ao criar produto');
      }
    }

    async function editProduct(productId, payload) {
      const response = await fetch(`${API_BASE_URL}/products/${productId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        const errorBody = await response.json().catch(() => ({}));
        throw new Error(errorBody.error || 'Falha ao editar produto');
      }
    }

    function openDeletePanel(product) {
      pendingDeleteId = product.id;
      deleteText.textContent = `Deseja excluir o produto #${product.id} - ${product.nome}?`;
      deletePanel.classList.remove('hidden');
    }

    function closeDeletePanel() {
      pendingDeleteId = null;
      deletePanel.classList.add('hidden');
    }

    async function deleteProduct(productId) {
      const response = await fetch(`${API_BASE_URL}/products/${productId}`, {
        method: 'DELETE'
      });

      if (!response.ok) {
        const errorBody = await response.json().catch(() => ({}));
        throw new Error(errorBody.error || 'Falha ao excluir produto');
      }
    }

    async function loadProducts() {
      try {
        const response = await fetch(`${API_BASE_URL}/products`);

        if (!response.ok) {
          throw new Error('Falha ao carregar produtos');
        }

        const data = await response.json();
        renderProducts(data.items || []);
      } catch (error) {
        productsBody.innerHTML = `
          <tr>
            <td colspan="6">Erro ao conectar com o backend.</td>
          </tr>
        `;
      }
    }

    createProductButton.addEventListener('click', () => {
      setMessage('');
      openCreateForm();
    });

    productForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const payload = collectFormPayload();

      try {
        if (editingProductId === null) {
          await createProduct(payload);
          setMessage('Produto criado com sucesso.');
        } else {
          await editProduct(editingProductId, payload);
          setMessage('Produto atualizado com sucesso.');
        }

        closeForm();
        await loadProducts();
      } catch (error) {
        setMessage(error.message);
      }
    });

    cancelFormButton.addEventListener('click', () => {
      closeForm();
    });

    confirmDeleteButton.addEventListener('click', async () => {
      if (!Number.isInteger(pendingDeleteId)) {
        return;
      }

      try {
        await deleteProduct(pendingDeleteId);
        closeDeletePanel();
        setMessage('Produto excluido com sucesso.');
        await loadProducts();
      } catch (error) {
        setMessage(error.message);
      }
    });

    cancelDeleteButton.addEventListener('click', () => {
      closeDeletePanel();
    });

    productsBody.addEventListener('click', async (event) => {
      const target = event.target;

      if (!(target instanceof HTMLButtonElement)) {
        return;
      }

      const action = target.dataset.action;
      const productId = Number(target.dataset.id);

      if (!action || !Number.isInteger(productId)) {
        return;
      }

      try {
        const product = currentProducts.find((item) => Number(item.id) === productId);
        if (!product) {
          setMessage('Produto nao encontrado na tabela.');
          return;
        }

        if (action === 'edit') {
          setMessage('');
          openEditForm(product);
          return;
        }

        if (action === 'delete') {
          setMessage('');
          openDeletePanel(product);
        }
      } catch (error) {
        setMessage(error.message);
      }
    });

    loadProducts();
  </script>
</body>
</html>
